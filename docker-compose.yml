services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./Backend
    restart: unless-stopped
    env_file:
      - ./Backend/.env
    environment:
      NODE_ENV: production
      PORT: 5002
      FRONTEND_URL: http://localhost:4001
      MONGO_URI: mongodb://mongo:27017/WebChat-MERN
    depends_on:
      - mongo
    ports:
      - "5002:5002"

  frontend:
    build:
      context: ./Frontend
      args:
        VITE_API_URL: http://localhost:5002
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4001:80"

volumes:
  mongo_data: